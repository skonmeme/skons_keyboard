# Makes a release when develop is merged into main (spec/STANDARD.md §8.7).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version
        id: version
        run: echo "version=$(cargo xtask release-check)" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        run: cargo test

      - name: Set up signing and notarization
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # Intermediate certificates of the Developer ID certificates.
          for ca in DeveloperIDCA DeveloperIDG2CA; do
            curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
            security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN"
          done

          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" > /dev/null

          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials "skon's Universe" --keychain "$KEYCHAIN" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          rm "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize and verify the packages
        env:
          NOTARY_KEYCHAIN: ${{ runner.temp }}/release.keychain-db
        run: cargo xtask package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo xtask release-notes > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" \
            "target/package/skonsKeyboard-$VERSION.pkg" \
            "target/package/skonsKeyboard-Uninstall-$VERSION.pkg" \
            --title "skon's Keyboard $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"

      - name: Delete the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
