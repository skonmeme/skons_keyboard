<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><style>body { font: 13px -apple-system, sans-serif; }</style></head>
<body>
<h3>설치가 끝났습니다</h3>
<ol>
    <li>메뉴 막대의 입력 메뉴에서 <b>Sebeolsik Final</b>(한글) 또는 <b>QWERTY</b>(영어)를 선택합니다.</li>
    <li>보이지 않으면 시스템 설정 &gt; 키보드 &gt; 텍스트 입력의 입력 소스 "편집…"에서 "+"를 누르고, 한국어 아래의 <b>skon's Keyboard</b>를 추가합니다.</li>
    <li>그래도 보이지 않으면 로그아웃한 뒤 다시 로그인합니다. 처음 설치할 때 필요할 수 있습니다.</li>
</ol>
<p>Shift+Space로 한글(세벌식 최종)과 영어(QWERTY)를 전환합니다.</p>
</body>
</html>
